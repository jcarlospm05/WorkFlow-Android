name: Charlas 5 Minutos V2.1 - APK
on:
  push:
    branches: [charlas5-v21-android]
    paths-ignore:
      - 'builds/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Charlas5Minutos-V2.1-Admin
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar APK en rama independiente
        run: |
          mkdir -p builds
          cp app/build/outputs/apk/debug/app-debug.apk builds/Charlas5Minutos-V2.1.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/Charlas5Minutos-V2.1.apk
          git diff --cached --quiet || (git commit -m "build: V2.1 APK [skip ci]" && git push)
